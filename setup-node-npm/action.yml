name: 'Setup Node.js'
description: 'Setup Node.js with npm token for private registry'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    # Workspace target: the active Node LTS. Callers override with `node-version:`
    # when they need to stay behind during a migration. Cf JUNI-1177.
    default: '24'
  npm-token:
    description: 'NPM token for private registry (set as NPM_GITHUB_TOKEN env var)'
    required: false

outputs:
  node-version:
    description: 'Installed Node.js version'
    value: ${{ steps.setup-node.outputs.node-version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set NPM_GITHUB_TOKEN environment variable
      if: inputs.npm-token != ''
      shell: bash
      run: echo "NPM_GITHUB_TOKEN=${{ inputs.npm-token }}" >> $GITHUB_ENV
