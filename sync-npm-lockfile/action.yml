name: 'Sync npm Lockfile'
description: 'Auto-sync package-lock.json when package.json changes (npm only)'

inputs:
  token:
    description: 'GitHub token with push permissions (PAT recommended for Dependabot PRs)'
    required: true
  working-directory:
    description: 'Directory containing package.json'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to use'
    required: false
    # MUST match the version the caller's CI jobs run on: a lockfile regenerated
    # under a different npm major can resolve differently. Cf JUNI-1177.
    default: '24'
  npm-token:
    description: >-
      Token for a private npm registry, exported as NPM_GITHUB_TOKEN for the npm steps.
      REQUIRED as soon as the project depends on a private package: `token` above only
      authenticates git, so without this npm resolves an empty variable in .npmrc and
      fails with `401 Unauthorized ... unauthenticated`. Cf JUNI-1285.
    required: false

runs:
  using: 'composite'
  steps:
    - name: Checkout PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        token: ${{ inputs.token }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check if lockfile needs update
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # --ignore-scripts: this step only answers "is the lockfile in sync?", which never
      # needs install scripts to run. Callers trigger this workflow on `pull_request_target`,
      # so the PR's code runs alongside repository secrets — a `preinstall` script was free
      # to read them. Callers should ALSO guard against fork PRs; this is defence in depth.
      env:
        NPM_GITHUB_TOKEN: ${{ inputs.npm-token }}
      run: |
        if npm ci --ignore-scripts 2>/dev/null; then
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "Lockfile is already in sync"
        else
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Lockfile needs regeneration"
        fi

    - name: Regenerate lockfile
      if: steps.check.outputs.needs_update == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NPM_GITHUB_TOKEN: ${{ inputs.npm-token }}
      run: |
        rm -f package-lock.json
        npm install --package-lock-only --ignore-scripts
        echo "package-lock.json regenerated"

    - name: Commit updated lockfile
      if: steps.check.outputs.needs_update == 'true'
      uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: "chore: sync package-lock.json"
        file_pattern: "${{ inputs.working-directory }}/package-lock.json"
